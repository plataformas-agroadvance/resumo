<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpósio Agroadvance – Kanban de Revisão</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
html,body{height:100%;background:#fff}

/* TOP BAR */
.topbar{background:#0D3365;border-bottom:3px solid #1E5FAA;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center}
.topbar-logo img{height:36px;filter:brightness(0) invert(1)}
.topbar-title{font-size:13px;color:rgba(255,255,255,.75);margin-left:20px;border-left:1px solid rgba(255,255,255,.2);padding-left:20px}
.topbar-right{display:flex;align-items:center;gap:10px}
.badge-total{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 16px;font-size:11px;font-weight:600}

/* BOARD */
.board-wrapper{background:#fff;padding:24px 32px;min-height:calc(100vh - 67px);display:flex;flex-direction:column}
.board{display:flex;gap:20px;align-items:flex-start;width:100%}
.col{flex:1 1 0;min-width:0}

/* COL HEADER */
.col-hdr{border-radius:10px 10px 0 0;padding:11px 16px;display:flex;align-items:center;justify-content:space-between}
.col-hdr-inner{display:flex;align-items:center;gap:8px}
.col-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.col-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.col-count{font-size:12px;font-weight:700;opacity:.85}
.hdr-todo{background:#1C3F6E;color:#8BB8E8}.hdr-todo .col-dot{background:#5B9BD5}
.hdr-wip {background:#1A4A6B;color:#5BC8F5}.hdr-wip  .col-dot{background:#1DB8F5}
.hdr-done{background:#0D3365;color:#B0CFEE}.hdr-done .col-dot{background:#B0CFEE}

/* CARD LIST */
.col-body{background:#F4F7FB;border:1px solid #C8D8EE;border-top:none;border-radius:0 0 10px 10px;padding:12px 10px;display:flex;flex-direction:column;gap:9px;min-height:100px}

/* CARD */
.card{background:#fff;border:1.5px solid #C8D8EE;border-radius:9px;padding:12px 14px;cursor:pointer;transition:.15s;box-shadow:0 1px 4px rgba(13,51,101,.07)}
.card:hover{border-color:#0D3365;box-shadow:0 4px 16px rgba(13,51,101,.15);transform:translateY(-2px)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.card-name{font-size:13px;font-weight:700;color:#0D3365;line-height:1.3}
.card-inst{font-size:11px;color:#5A7A9A;margin-top:2px}
.chip{font-size:10px;border-radius:5px;padding:2px 8px;white-space:nowrap;font-weight:700;flex-shrink:0}
.chip-new {background:#DBEAFE;color:#1E40AF}
.chip-rev {background:#FEF3C7;color:#92400E}
.chip-ok  {background:#D1FAE5;color:#065F46}
.chip-corr{background:#FFEDD5;color:#9A3412}
.card-file{font-size:11px;color:#1255A0;margin-top:6px;text-decoration:underline;cursor:pointer}
.card-file:hover{color:#0D3365}
.card-date{font-size:10px;color:#9AABB8;margin-top:4px}

/* SUB COLS */
.subcol{margin-top:0}.subcol+.subcol{margin-top:14px}
.sub-hdr{border-radius:8px;padding:7px 12px;display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sub-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sub-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.sub-ok   .sub-hdr{background:#065F46}.sub-ok   .sub-dot{background:#34D399}.sub-ok   .sub-name{color:#A7F3D0}
.sub-corr .sub-hdr{background:#7C2D12}.sub-corr .sub-dot{background:#FB923C}.sub-corr .sub-name{color:#FED7AA}
.sub-body{background:#EBF1F8;border:1px solid #C8D8EE;border-radius:8px;padding:9px 8px;display:flex;flex-direction:column;gap:8px;min-height:44px}

/* ADD BTN */
.add-btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:9px;background:transparent;border:1.5px dashed #B0C8E0;border-radius:8px;color:#7A9ABB;font-size:11px;cursor:pointer;width:100%;margin-top:10px;transition:.15s}
.add-btn:hover{background:#EEF4FB;border-color:#0D3365;color:#0D3365}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{background:#0D3365;padding:17px 22px;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:space-between}
.modal-title{color:#fff;font-size:14px;font-weight:700}
.modal-close{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:6px;color:#fff;font-size:16px;padding:2px 10px;cursor:pointer;line-height:1.5}
.modal-close:hover{background:rgba(255,255,255,.25)}
.modal-body{padding:20px 22px}

/* FORM ELEMENTS */
.section-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#6B8BAA;margin-bottom:8px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.info-cell{background:#F4F7FB;border:1px solid #C8D8EE;border-radius:8px;padding:9px 11px}
.info-cell.full{grid-column:1/-1}
.info-l{font-size:10px;color:#6B8BAA}
.info-v{font-size:12px;color:#0D3365;font-weight:600;margin-top:2px}
.divider{border:none;border-top:1px solid #D8E6F0;margin:14px 0}
.field{width:100%;padding:9px 11px;border-radius:8px;border:1.5px solid #C8D8EE;background:#F8FBFF;color:#0D3365;font-size:12px;font-family:inherit;margin-bottom:8px}
.field:focus{outline:none;border-color:#0D3365}
.textarea{width:100%;min-height:72px;resize:vertical;font-size:12px;font-family:inherit;padding:10px;border:1.5px solid #C8D8EE;border-radius:8px;background:#F8FBFF;color:#0D3365;margin-bottom:10px}
.textarea:focus{outline:none;border-color:#0D3365}

/* ANEXO DO REVISOR */
.anexo-box{border:1.5px dashed #B0C8E0;border-radius:9px;padding:12px 14px;background:#F8FBFF;margin-bottom:14px;transition:.15s}
.anexo-box:hover{border-color:#0D3365;background:#EEF4FB}
.anexo-label{display:flex;align-items:center;gap:10px;cursor:pointer}
.anexo-icon{width:36px;height:36px;background:#0D3365;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.anexo-text .at-title{font-size:12px;font-weight:700;color:#0D3365}
.anexo-text .at-sub  {font-size:10px;color:#6B8BAA;margin-top:2px}
#file-input{display:none}
.anexo-preview{display:none;margin-top:10px;padding:9px 12px;background:#D1FAE5;border:1px solid #059669;border-radius:8px;font-size:11px;color:#065F46;align-items:center;gap:8px}
.anexo-preview.show{display:flex}
.anexo-preview .ap-name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anexo-preview .ap-remove{cursor:pointer;font-size:14px;color:#9A3412;flex-shrink:0}
.ap-remove:hover{color:#EA580C}

/* BOTÕES */
.btn-iniciar{display:block;width:100%;padding:11px;border-radius:9px;background:#0D3365;border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.btn-iniciar:hover{background:#1255A0}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-ok  {display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:9px;background:#D1FAE5;border:1.5px solid #059669;color:#065F46;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.btn-ok:hover  {background:#059669;color:#fff}
.btn-corr{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:9px;background:#FFEDD5;border:1.5px solid #EA580C;color:#9A3412;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.btn-corr:hover{background:#EA580C;color:#fff}
.status-chip{font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;display:inline-block;margin-bottom:14px}

/* LINK ARQUIVO */
.file-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#1255A0;font-weight:600;text-decoration:none}
.file-link:hover{color:#0D3365;text-decoration:underline}
.file-link-box{background:#EEF4FB;border:1px solid #C8D8EE;border-radius:8px;padding:9px 12px;margin-top:2px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:300;background:#fff;border-radius:10px;padding:14px 18px;font-size:12px;box-shadow:0 6px 28px rgba(0,0,0,.18);display:none;align-items:center;gap:12px;border-left:4px solid #059669;min-width:300px}
.toast.warn{border-color:#EA580C}
.toast.show{display:flex;animation:si .25s ease}
@keyframes si{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toast-icon{font-size:20px}
.toast-content .toast-title{font-weight:700;color:#0D3365;font-size:12px}
.toast-content .toast-sub  {color:#5A7A9A;font-size:11px;margin-top:2px}

/* EMPTY */
.empty{text-align:center;padding:18px 8px;color:#8AA8C8;font-size:11px;line-height:1.6}
.empty-icon{font-size:22px;margin-bottom:5px;opacity:.45}
</style>
</head>

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){

  const chipMap = {
    todo:['Novo','chip-new'],
    wip: ['Em revisão','chip-rev'],
    ok:  ['Aprovado','chip-ok'],
    corr:['Correção','chip-corr']
  };

  Object.keys(cols).forEach(k=>{
    const el = document.getElementById('col-'+k);
    if(!cols[k].length){
      const msg = {
        todo:'<div class="empty-icon">📥</div>Aguardando resumos<br>recebidos pelo FluentForms',
        wip: '<div class="empty-icon">🔍</div>Nenhum resumo<br>em revisão',
        ok:  'Nenhum aprovado ainda',
        corr:'Nenhuma correção ainda'
      };
      el.innerHTML=`<div class="empty" style="${k==='ok'||k==='corr'?'padding:8px 0;font-size:10px':''}">${msg[k]}</div>`;
      return;
    }
    el.innerHTML='';
    cols[k].forEach(c=>{
      const [lbl,cls]=chipMap[c.status];
      const d=document.createElement('div');
      d.className='card';
      d.onclick=()=>openCard(c.id);
      // nome do arquivo — se tiver URL abre em nova aba, senão só texto
      const fileHtml = c.fileUrl
        ? `<div class="card-file" onclick="event.stopPropagation();window.open('${esc(c.fileUrl)}','_blank')">📄 ${esc(c.file||'resumo.pdf')} ↗</div>`
        : `<div class="card-file" style="text-decoration:none;cursor:default;color:#6B8BAA">📄 ${esc(c.file||'resumo.pdf')}</div>`;
      d.innerHTML=`
        <div class="card-head">
          <div><div class="card-name">${esc(c.nome)}</div><div class="card-inst">${esc(c.cargo||c.inst||'—')}</div></div>
          <span class="chip ${cls}">${lbl}</span>
        </div>
        ${fileHtml}
        <div class="card-date">📅 ${esc(c.data)}</div>
      `;
      el.appendChild(d);
    });
  });

  document.getElementById('cnt-todo').textContent = cols.todo.length;
  document.getElementById('cnt-wip').textContent  = cols.wip.length;
  document.getElementById('cnt-done').textContent = cols.ok.length+cols.corr.length;
  const t=cards.length;
  document.getElementById('badge-total').textContent=t+(t===1?' resumo':' resumos');
}

// ─── ABRIR CARD ───────────────────────────────────────────────────────────────
function openCard(id){
  editId=id;
  reviewerFile=null;
  const c=cards.find(x=>x.id===id);
  document.getElementById('modal-ttl').textContent=c.nome;

  const sMap={
    todo:['chip-new','A Fazer'],
    wip: ['chip-rev','Em Revisão'],
    ok:  ['chip-ok','Aprovado'],
    corr:['chip-corr','Correção Solicitada']
  };
  const [cls,lbl]=sMap[c.status];

  // Arquivo do autor
  const arquivoAutor = c.fileUrl
    ? `<div class="file-link-box"><a class="file-link" href="${esc(c.fileUrl)}" target="_blank">📄 ${esc(c.file||'resumo.pdf')} <span style="font-size:10px;opacity:.7">↗ abrir/baixar</span></a></div>`
    : `<div class="file-link-box" style="color:#6B8BAA;font-size:12px">📄 ${esc(c.file||'resumo.pdf')} <span style="font-size:10px">(URL não disponível)</span></div>`;

  const dadosLead=`
    <div class="section-lbl">Dados do lead</div>
    <div class="info-grid">
      <div class="info-cell"><div class="info-l">Nome</div><div class="info-v">${esc(c.nome)}</div></div>
      <div class="info-cell"><div class="info-l">E-mail</div><div class="info-v" style="font-size:11px">${esc(c.email)}</div></div>
      <div class="info-cell"><div class="info-l">Celular / WhatsApp</div><div class="info-v">${esc(c.celular||'—')}</div></div>
      <div class="info-cell"><div class="info-l">Concluiu faculdade?</div><div class="info-v">${esc(c.concluiu_faculdade||'—')}</div></div>
      <div class="info-cell"><div class="info-l">Cargo atual</div><div class="info-v">${esc(c.cargo||'—')}</div></div>
      <div class="info-cell"><div class="info-l">Especificação do cargo</div><div class="info-v">${esc(c.cargo_especifico||'—')}</div></div>
      <div class="info-cell full"><div class="info-l">Resumo enviado</div>${arquivoAutor}</div>
      <div class="info-cell full"><div class="info-l">Data de envio</div><div class="info-v">${esc(c.data)}</div></div>
    </div>
  `;

  // Bloco de anexo do revisor (só no status wip)
  const anexoRevisor=`
    <div class="section-lbl">Anexo do revisor <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:10px;color:#9AABB8">(opcional — enviado junto no e-mail)</span></div>
    <div class="anexo-box" id="anexo-box" onclick="document.getElementById('file-input').click()">
      <div class="anexo-label">
        <div class="anexo-icon">📎</div>
        <div class="anexo-text">
          <div class="at-title">Clique para anexar arquivo</div>
          <div class="at-sub">PDF, DOC, DOCX ou ZIP — versão corrigida ou feedback</div>
        </div>
      </div>
    </div>
    <div class="anexo-preview" id="anexo-preview">
      <span style="font-size:16px">📎</span>
      <span class="ap-name" id="ap-name"></span>
      <span class="ap-remove" onclick="removeAnexo(event)" title="Remover">✕</span>
    </div>
  `;

  let acoes='';

  // A FAZER
  if(c.status==='todo'){
    acoes=`
      <hr class="divider">
      <div class="section-lbl">Comentários do revisor</div>
      <textarea class="textarea" id="ta" placeholder="Anotações, observações, feedback...">${esc(c.comment||'')}</textarea>
      <hr class="divider">
      <div class="section-lbl">Ação</div>
      <button class="btn-iniciar" onclick="moverWip()">🔍 Iniciar revisão deste resumo</button>
    `;

  // FAZENDO
  } else if(c.status==='wip'){
    acoes=`
      <hr class="divider">
      <div class="section-lbl">Comentários do revisor</div>
      <textarea class="textarea" id="ta" placeholder="Anotações, observações, feedback...">${esc(c.comment||'')}</textarea>
      ${anexoRevisor}
      <hr class="divider">
      <div class="section-lbl">Finalizar — dispara e-mail automático</div>
      <div class="action-row">
        <button class="btn-ok"   onclick="finalizar('ok')">✓ Aprovar e enviar e-mail</button>
        <button class="btn-corr" onclick="finalizar('corr')">↩ Solicitar correção e enviar e-mail</button>
      </div>
    `;

  // PRONTO ou CORREÇÃO — só leitura
  } else {
    const isOk=c.status==='ok';
    const anexoFeedbackHtml = c.reviewerFileName
      ? `<div style="margin-top:8px;display:flex;align-items:center;gap:8px;font-size:11px;color:#065F46;background:#D1FAE5;border-radius:7px;padding:8px 10px"><span>📎</span><span style="font-weight:600">${esc(c.reviewerFileName)}</span> <span style="color:#6B8BAA">(anexado pelo revisor)</span></div>`
      : '';
    acoes=`
      <hr class="divider">
      <div class="section-lbl">Comentários registrados</div>
      <div style="background:#F4F7FB;border:1px solid #C8D8EE;border-radius:8px;padding:11px 13px;font-size:12px;color:#0D3365;min-height:52px">
        ${c.comment?esc(c.comment):'<span style="color:#8AA8C8;font-style:italic">Sem comentários registrados.</span>'}
      </div>
      ${anexoFeedbackHtml}
      <div style="margin-top:12px;padding:11px 14px;background:${isOk?'#D1FAE5':'#FFEDD5'};border:1.5px solid ${isOk?'#059669':'#EA580C'};border-radius:9px;font-size:11px;color:${isOk?'#065F46':'#9A3412'};display:flex;align-items:center;gap:10px">
        <span style="font-size:18px">${isOk?'✉️':'📋'}</span>
        <span>${isOk?'E-mail de aprovação enviado automaticamente.':'E-mail de correção enviado automaticamente.'}<br><strong>Para: ${esc(c.email)}</strong></span>
      </div>
    `;
  }

  document.getElementById('modal-body').innerHTML=`
    <div style="margin-bottom:14px"><span class="status-chip ${cls}">${lbl}</span></div>
    ${dadosLead}${acoes}
  `;
  document.getElementById('overlay').classList.add('open');
}

// ─── UPLOAD DO REVISOR ────────────────────────────────────────────────────────
function onFileSelected(input){
  if(!input.files||!input.files[0]) return;
  reviewerFile = input.files[0];
  document.getElementById('ap-name').textContent = reviewerFile.name;
  document.getElementById('anexo-preview').classList.add('show');
  document.getElementById('anexo-box').style.borderColor='#059669';
  document.getElementById('anexo-box').style.background='#F0FFF4';
  // reset input para permitir re-seleção do mesmo arquivo
  input.value='';
}

function removeAnexo(e){
  e.stopPropagation();
  reviewerFile=null;
  document.getElementById('ap-name').textContent='';
  document.getElementById('anexo-preview').classList.remove('show');
  document.getElementById('anexo-box').style.borderColor='';
  document.getElementById('anexo-box').style.background='';
}

// ─── MOVER PARA FAZENDO ───────────────────────────────────────────────────────
function moverWip(){
  const c=cards.find(x=>x.id===editId);
  const ta=document.getElementById('ta');
  if(ta) c.comment=ta.value;
  c.status='wip';
  closeModal(); render();
  showToast('🔍 Em revisão',`"${c.nome}" movido para Fazendo`,false);
}

// ─── FINALIZAR ────────────────────────────────────────────────────────────────
function finalizar(tipo){
  const c=cards.find(x=>x.id===editId);
  const ta=document.getElementById('ta');
  if(ta) c.comment=ta.value;

  // Salva nome do arquivo do revisor (em produção faria upload p/ Supabase)
  if(reviewerFile){
    c.reviewerFileName=reviewerFile.name;
    // TODO: upload reviewerFile para Supabase Storage e salvar URL em c.reviewerFileUrl
  } else {
    c.reviewerFileName=null;
  }

  c.status=tipo;
  reviewerFile=null;
  closeModal(); render();

  const temAnexo = !!c.reviewerFileName;

  // ── CHAMAR WORKFLOW 2 DO N8N ──────────────────────────────────────────────
  // Substitua a URL abaixo pela URL real do seu webhook no n8n
  const N8N_EMAIL_WEBHOOK = 'https://SEU-N8N.com/webhook/simposio-email';

  fetch(N8N_EMAIL_WEBHOOK, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      tipo:               tipo,
      nome:               c.nome,
      email:              c.email,
      celular:            c.celular            || '',
      concluiu_faculdade: c.concluiu_faculdade || '',
      cargo:              c.cargo              || '',
      cargo_especifico:   c.cargo_especifico   || '',
      arquivo_nome:       c.file               || '',
      comentario:         c.comment            || '',
      // revisor_arquivo_url: c.reviewerFileUrl  // ativar após Supabase Storage
    })
  })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(() => {
    if(tipo==='ok'){
      showToast('✉️ E-mail de aprovação enviado!', `Para: ${c.email}`, false);
    } else {
      showToast(
        '📋 E-mail de correção enviado!' + (temAnexo?' (com anexo)':''),
        `Para: ${c.email}${temAnexo?' — '+c.reviewerFileName:''}`,
        true
      );
    }
  })
  .catch(err => {
    console.error('Erro ao chamar webhook n8n:', err);
    showToast('⚠️ Atenção', 'Status atualizado mas o e-mail pode não ter sido enviado. Verifique o n8n.', true);
  });
}

// ─── ADICIONAR MANUALMENTE ────────────────────────────────────────────────────
function openNew(){
  editId=null; reviewerFile=null;
  document.getElementById('modal-ttl').textContent='Adicionar resumo manualmente';
  document.getElementById('modal-body').innerHTML=`
    <div style="font-size:11px;color:#5A7A9A;margin-bottom:16px;padding:10px 13px;background:#F4F7FB;border-radius:8px;border:1px solid #C8D8EE">
      ℹ️ Em produção os resumos chegam automaticamente via <strong>FluentForms → n8n → Supabase</strong>.
    </div>
    <div class="section-lbl">Dados do lead</div>
    <div style="display:flex;flex-direction:column">
      <input id="n-nome"             class="field" placeholder="Nome completo *">
      <input id="n-email"            class="field" placeholder="E-mail *">
      <input id="n-celular"          class="field" placeholder="Celular / WhatsApp">
      <input id="n-faculdade"        class="field" placeholder="Concluiu faculdade? (Sim / Não)">
      <input id="n-cargo"            class="field" placeholder="Cargo atual">
      <input id="n-cargo-especifico" class="field" placeholder="Especificação do cargo">
      <input id="n-file"             class="field" placeholder="Nome do arquivo (ex: resumo_joao.doc)">
      <input id="n-fileUrl"          class="field" placeholder="URL do arquivo (ex: https://storage.supabase.co/...)">
    </div>
    <button class="btn-ok" style="width:100%;padding:12px;margin-top:4px" onclick="saveNew()">+ Adicionar em "A Fazer"</button>
  `;
  document.getElementById('overlay').classList.add('open');
}

function saveNew(){
  const nome =document.getElementById('n-nome').value.trim();
  const email=document.getElementById('n-email').value.trim();
  if(!nome||!email){alert('Nome e e-mail são obrigatórios.');return;}
  cards.push({
    id:uid(),nome,email,
    inst:   document.getElementById('n-inst').value.trim(),
    area:   document.getElementById('n-area').value.trim(),
    file:   document.getElementById('n-file').value.trim()||'resumo.pdf',
    fileUrl:document.getElementById('n-fileUrl').value.trim()||null,
    data:   new Date().toLocaleDateString('pt-BR'),
    status:'todo',comment:'',reviewerFileName:null
  });
  closeModal(); render();
  showToast('✅ Resumo adicionado',`"${nome}" está em A Fazer`,false);
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function closeModal(){ document.getElementById('overlay').classList.remove('open'); reviewerFile=null; }
function closeBg(e){ if(e.target===document.getElementById('overlay')) closeModal(); }

let toastTimer=null;
function showToast(title,sub,warn){
  const t=document.getElementById('toast');
  clearTimeout(toastTimer);
  t.className='toast'+(warn?' warn':'');
  document.getElementById('toast-title').textContent=title;
  document.getElementById('toast-sub').textContent=sub;
  t.classList.add('show');
  toastTimer=setTimeout(()=>{t.className='toast';},5500);
}

render();
</script>
